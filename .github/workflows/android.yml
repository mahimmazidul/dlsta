name: Build dlsta Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Test the shared web interface
        working-directory: .
        run: npm ci && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and lint
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug
      - name: Prepare persistent APK signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_DLSTA_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_DLSTA_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dlsta-signing.jks"
            echo "DLSTA_KEYSTORE_PATH=$RUNNER_TEMP/dlsta-signing.jks" >> "$GITHUB_ENV"
            echo "DLSTA_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "DLSTA_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "DLSTA_KEY_ALIAS=dlsta" >> "$GITHUB_ENV"
            echo 'mode=release' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Signing secrets are missing. The debug APK will install but future builds may require uninstalling it first.'
            echo 'mode=debug' >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$MODE" = release ]; then
            gradle --no-daemon --max-workers=2 :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dlsta-android.apk"
          else
            gradle --no-daemon --max-workers=2 :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dlsta-android-debug.apk"
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: dlsta-android-apk
          path: ${{ runner.temp }}/dlsta-android*.apk
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: |
            set +e
            gradle --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
            result=$?
            adb pull /sdcard/Android/data/com.mahimmazidul.dlsta/files/native-screen.png native-screen.png || true
            exit "$result"
      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlsta-android-emulator-report
          path: |
            android/app/build/reports/androidTests/connected/
            android/native-screen.png
          if-no-files-found: ignore
          retention-days: 30
