plugins { id 'com.android.application' }

android {
    namespace 'com.mahimmazidul.dlsta'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mahimmazidul.dlsta'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.0.0-beta.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('DLSTA_KEYSTORE_PATH')) {
                storeFile file(System.getenv('DLSTA_KEYSTORE_PATH'))
                storePassword System.getenv('DLSTA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DLSTA_KEY_ALIAS')
                keyPassword System.getenv('DLSTA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('DLSTA_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
